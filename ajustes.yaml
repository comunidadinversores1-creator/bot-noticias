#    vence           último día en que sale. Ej: "2026-12-31". Después deja de salir sola y te avisa
#    imagen          una imagen propia, ej. assets/promos/senales.jpg
#                    (en modo "ninguna" se publica tal cual · en modo "placa" va arriba y el bot le suma el texto)
#  Los porcentajes solo se aceptan si son un dato del producto que figure acá
#  (un reintegro, un descuento). Nunca como rendimiento o ganancia.

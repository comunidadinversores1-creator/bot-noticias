# ------------------------------------------------------------
#  CEREBRO (la IA que elige y redacta).  Usa la primera clave que encuentre.
#  No hace falta tocar esto.
# ------------------------------------------------------------
ia:
  orden: [anthropic, gemini, groq, openai, xai]   # xai = Grok: de respaldo, si Gemini está caído o saturado
  modelos:
    anthropic: ["claude-haiku-4-5-20251001"]
    gemini: ["gemini-3.5-flash-lite", "gemini-3.1-flash-lite", "gemini-flash-latest"]
    groq: ["openai/gpt-oss-120b", "qwen/qwen3.8-27b", "openai/gpt-oss-20b"]
    openai: ["gpt-4.1-mini"]
    xai: ["grok-4.7"]
  candidatos_por_corrida: 30
  candidatos_de_socios: 6         # de esos 30, como mucho 6 son noticias de tus socios (para que no tapen al resto)

# ---------------------------------------------------------------- Instagram
# Carruseles para @ezebagnato: rotan todos los estilos (titular, editorial, partida) y todos los tipos
# (enseñanza: qué es Bitcoin, blockchain, USDT...; errores; hábitos; mentalidad; bots). Ninguno reemplaza a otro.
# Mientras Instagram no esté conectado, el bot te manda cada carrusel por privado en Telegram, listo para subir.
# Días: 0 = lunes ... 6 = domingo.
instagram:
  carruseles: true
  carrusel_noticias:              # una noticia muy fuerte (ej. un hackeo enorme) sale también como carrusel en @ezebagnato
    activa: true
    impacto_minimo: 9
    max_por_dia: 1
  semanal:                        # el resumen de la semana, en @comunidad_inversores_ok
    activa: true
    dia: 6                        # 0 = lunes ... 6 = domingo
    hora: "19:00"
    cantidad: 5
  dias_carrusel: [0, 2, 4, 6]
  hora_carrusel: "18:00"
  # Guías que se mandan por DM a quien comenta la palabra del carrusel (la palabra va en mayúsculas).
  guias:
    BITCOIN:
      link: "https://github.com/comunidadinversores1-creator/bot-noticias/blob/main/guias/que-es-bitcoin.pdf"
      mensaje: "¡Hola! 🙌 Acá tenés la guía «¿Qué es Bitcoin?»: 14 páginas con todo explicado, cómo comprar, dónde guardarlo y el whitepaper de Satoshi.\n\n👉 {link}\n\nSi te sirve, seguime acá y en mis otras redes para más: https://linktr.ee/comunidadinversores"
      respuesta: "¡Listo! Te mandé la guía por DM 📩"
      respuesta_sin_dm: "¡Gracias! En un rato te la mando por DM 📩"
  # Historias. @ezebagnato: agenda económica a la mañana, aviso antes de un dato fuerte, "nuevo carrusel" y
  # una promo cada 2 días (máximo 3 por día). @comunidad_inversores_ok: cada noticia que sale (máximo 6 por día).
  historias:
    activa: true
    max_ezebagnato: 8             # agenda + avisos de datos + promo + el video de la campaña + hasta 3 noticias
    max_comunidad: 9              # agenda + avisos de datos + las noticias que salen (hasta 6)
    agenda_comunidad: true        # la agenda económica y los avisos de datos también en @comunidad_inversores_ok
    noticias_ezebagnato:          # solo las noticias más importantes en las historias de @ezebagnato
      activa: true
      impacto_minimo: 8
      max_por_dia: 3
    agenda_hora: "07:45"
    promo_hora: "20:00"
    promo_cada_dias: 2
    noticias_comunidad: true

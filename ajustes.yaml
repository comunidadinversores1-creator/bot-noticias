# ============================================================
#  AJUSTES DEL BOT DE NOTICIAS  ·  Ezequiel Bagnato | Comunidad Inversores
#  Todo lo que se puede cambiar sin tocar el programa está acá.
# ============================================================

# Interruptor general.  false = el bot no publica nada.
encendido: false

marca:
  nombre: "EZEQUIEL BAGNATO | COMUNIDAD INVERSORES"   # lo de antes de la barra va arriba, lo de después abajo
  firma: "@C_INVERSORES"                              # aparece chiquito al pie de la imagen
  # El logo es assets/logo.png (la cara de Eze en círculo).

telegram:
  publicar: true
  destino: "@comunidad_inversores_anuncios"   # canal donde publica (tu canal "Noticias Financieras Diarias"). Se puede cambiar por otro
  chat_prueba: ""                 # chat privado donde llegan las pruebas y los avisos de error

x:
  publicar: true
  # X cobra USD 0,015 por post sin link y USD 0,20 por post con link. Opciones:
  #   false   = nunca pone el link; dice "el link está en mi perfil"   (unos USD 4,50 por mes)
  #   promos  = pone tu link solo en las promos                        (unos USD 21 por mes)
  #   siempre = también en las noticias que llevan llamado             (hasta unos USD 32 por mes)
  poner_links: false
  texto_sin_link: "el link está en mi perfil"
  marcar_publicidad: true         # X exige avisar cuando un post tiene link de afiliado o es una promo

ritmo:
  zona_horaria: "America/Argentina/Buenos_Aires"
  max_por_dia: 10                 # tope de publicaciones por día (noticias + promos)
  promos_por_dia: 3               # cuántas de esas 10 son ventas de tus herramientas y campañas
  horarios_promos: ["10:30", "15:30", "20:30"]   # desde esa hora sale la promo que toca
  horas_entre_promos: 3           # nunca dos promos pegadas
  max_llamados_por_dia: 2         # tope de noticias con "registrate con mi link" (aparte de las promos)
  minutos_entre_publicaciones: 40 # separación mínima entre una y otra (el bot mira una vez por hora)
  impacto_minimo: 7               # del 1 al 10. Más alto = publica menos, solo lo fuerte
  impacto_de_relleno: 6           # si el día viene flojo (van 2 o más de atraso) también sale lo de este impacto. Con 7 nunca rellena
  silencio_desde: "00:00"         # de madrugada no publica...
  silencio_hasta: "07:00"
  impacto_urgente: 9              # ...salvo que la noticia sea de este impacto o más
  antiguedad_maxima_horas: 6      # no publica noticias más viejas que esto

# ------------------------------------------------------------
#  IMAGEN
#    modo: ninguna = el bot publica solo el texto. La imagen la hacés vos a mano (por ejemplo en ChatGPT).
#    modo: placa   = el bot arma la imagen solo, con el logo oficial o una foto real y el titular.
#  idea_para_chatgpt: después de cada noticia te manda por privado un texto listo para
#  pegar en ChatGPT y que te haga la imagen de esa noticia.
# ------------------------------------------------------------
imagen:
  modo: ninguna
  idea_para_chatgpt: true

# Colores de la imagen (para el modo "placa") según cómo cae la noticia en el mercado.
colores:
  alcista: "#22C55E"              # verde
  bajista: "#EF4444"              # rojo
  neutral: "#3B82F6"              # azul
  promo: "#F5B50A"                # dorado (el del aro de tu logo)
  fondo: "#0B0F14"

# Temas que el bot puede publicar (el nombre es el que sale en la imagen).
categorias:
  - ECONOMÍA
  - MERCADOS
  - INDICADORES
  - CRIPTO
  - EXCHANGES
  - BROKERS
  - EMPRESAS
  - GEOPOLÍTICA
  - REGULACIÓN
  - ARGENTINA


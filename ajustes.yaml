# ------------------------------------------------------------
#  GROK (la IA de X, lee X en tiempo real). Necesita la llave XAI_API_KEY en GitHub.
#  - Temas del día: a la mañana y a la tarde busca de qué se habla en X, y las preguntas salen sobre eso.
#  - Posts virales: una vez por día te manda al privado los posts que están explotando, para que les
#    respondas vos (responder automático a otras personas está prohibido en X).
# ------------------------------------------------------------
grok:
  activa: true
  # modo: auto  = usa Grok mientras tenga saldo; cuando se acaba, pasa solo a la búsqueda gratis (titulares de tus fuentes + tendencias de Google + Gemini)
  #       gratis = nunca usa Grok (no gasta nada): temas del día de Google y links de búsqueda en X
  modo: gratis
  modelo: "grok-4.7"
  temas_horas: ["08:00"]           # 1 vez por día (cada búsqueda en X se cobra por los posts que lee)
  virales_hora: "10:00"
  virales_cantidad: 5
  ideas_horarios: ["12:00", "16:00", "21:00"]   # el bot publica en X las ideas del día (posts que pegaron por su formato, con tu voz)
  inspiracion_cantidad: 3         # junto con los virales: posts que pegaron por su formato + un borrador tuyo para adaptar
  estrategias_dia: 0               # informe semanal de estrategias de las cuentas que más crecen: 0 = lunes
  estrategias_hora: "09:00"
  citar_impacto: 8                # cuando sale una noticia así de grande, te manda el post de X más fuerte sobre ella para citarlo
  citas_por_dia: 1
  areas: "trading, criptomonedas, exchanges, inteligencia artificial, empresas tecnológicas, bolsa, economía, guerras y conflictos que mueven los mercados, dólar, dinero y ahorro"

# ------------------------------------------------------------
#  HILO SEMANAL (domingos): "lo que movió el mercado esta semana", hilo en X + resumen en Telegram.
# ------------------------------------------------------------
hilo_semanal:
  activa: true
  dia: 6                          # 0 = lunes ... 6 = domingo
  hora: "11:00"
  cantidad: 5

# ------------------------------------------------------------
#  CALENDARIO ECONÓMICO (Telegram y X):
#  - a la mañana, la agenda del día con los datos importantes (inflación, empleo, tasas...)
#  - un rato antes de cada dato, un aviso: a qué hora sale, qué se espera y que puede haber volatilidad
#  Datos: calendario público de Forex Factory. Solo los de impacto alto y de estos países.
# ------------------------------------------------------------
calendario:
  activa: true
  agenda_hora: "07:30"
  impacto: ["High"]
  paises: ["USD", "EUR", "CNY"]     # solo EE.UU., zona euro y China (lo pidió Eze: Canadá y Australia no le importan a nadie)
  aviso_desde_min: 10                             # el aviso sale entre 10 y 80 minutos antes del dato
  aviso_hasta_min: 80

# ------------------------------------------------------------
#  CHARLA EN X: preguntas, dilemas y casos cortos para que la gente responda (solo en X).
#  Van aparte de las noticias: no cuentan para el tope de 10 por día.
#  Debajo de cada una, el bot responde con la invitación a seguirte (así la gente que llega
#  por un post que se hace viral sabe por qué seguirte).
# ------------------------------------------------------------
x_charla:
  activa: true
  horarios: ["19:00", "22:00"]      # una después de cada horario (en los huecos de X, sin pisar noticias ni promos)
  encuesta_turno: 2                           # la 2.ª pregunta del día (22:00) es una ENCUESTA de X (0 = sin encuestas)
  # Debajo de cada pregunta, una de estas (van rotando):
  respuestas:
    - "si te hacen pensar estas preguntas, seguime.\n\ntodos los días subo una sobre trading, bots, IA y dinero. y las noticias que mueven el mercado, apenas salen."
    - "subo una de estas todos los días.\n\nsi te interesan el trading, los bots y el dinero, hablados con números y sin humo, seguime para no perderte la próxima."
    - "mañana hay otra.\n\nseguime si te interesa el trading, los bots de IA y cómo cuidar tu dinero sin vender humo."

  # VENTA: preguntas que hacen pensar en el problema que resuelve un producto tuyo.
  # Abajo, la respuesta lleva al producto (X la marca como publicidad).
  ventas:
    - producto: "Exness Terminal: operar con un clic, stop loss y take profit desde el gráfico, hasta 8 gráficos y calendario económico"
      datos: "Exness Terminal tiene One-Click Trading, más de 100 indicadores, hasta 8 gráficos a la vez, SL y TP desde el gráfico y calendario económico integrado."
      respuesta: "yo opero desde Exness Terminal: un clic para entrar, stop loss y take profit desde el gráfico, y el calendario económico a la vista.\n\nsi querés probarlo, mi link está en el perfil. operar con apalancamiento implica riesgo."

# ------------------------------------------------------------
#  ENSEÑANZA: 3 por día, en Telegram (canal y tema del grupo) y en X.
#  Cada una explica una de las preguntas que más se buscan en Google, de a una y sin repetir.
#  Si un tema necesita datos exactos (una herramienta, los pasos de una app), ponelos en "datos"
#  y la IA usa SOLO eso. Para sumar temas, agregá renglones.
# ------------------------------------------------------------
ensenanza:
  activa: true
  horarios: ["08:00", "13:00", "18:00"]
  temas:
    - "¿Qué es Bitcoin y cómo funciona?"
    - {pregunta: "¿Cómo se usa el trading con un clic en Exness Terminal?", datos: "Exness Terminal tiene One-Click Trading: permite abrir y cerrar operaciones de mercado con un solo clic, sin una ventana adicional de confirmación. Puede servir para scalping o para operar noticias, donde la velocidad importa. Operar con apalancamiento implica riesgo de perder el capital."}
    - "¿Qué es la blockchain, explicado fácil?"
    - "¿Qué es el P2P en cripto y cómo se usa sin que te estafen?"
    - "¿Qué es un stop loss y cómo se usa?"
    - "¿Qué es una stablecoin como USDT o USDC?"
    - {pregunta: "¿Cómo poner stop loss y take profit desde el gráfico en Exness Terminal?", datos: "En Exness Terminal el Stop Loss y el Take Profit se pueden gestionar directamente desde el gráfico. El Terminal tiene más de 100 indicadores, hasta 8 gráficos al mismo tiempo y calendario económico integrado."}
    - "¿Qué es el apalancamiento en trading y por qué es peligroso?"
    - "¿Qué es el trading y en qué se diferencia de invertir?"
    - "¿Qué es un bot de trading y cómo funciona?"
    - {pregunta: "¿Para qué sirve el calendario económico de Exness Terminal?", datos: "Exness Terminal tiene un calendario económico integrado: muestra los eventos que pueden mover el mercado (datos de empleo, inflación, decisiones de tasas) para no operar a ciegas cuando sale una noticia fuerte."}
    - "¿Qué es el spread en un broker?"
    - "¿Qué es un backtest y para qué sirve?"
    - "¿Qué es una billetera cripto y cuál es la diferencia con un exchange?"
    - "¿Qué es el take profit?"
    - "¿Qué es el drawdown de una estrategia?"
    - "¿Qué es un lote en forex?"
    - "¿Qué es el staking?"
    - "¿Cuánto dinero necesito para empezar a invertir?"
    - "¿Qué es la inflación y cómo afecta a tus ahorros?"
    - "¿Qué es el riesgo país?"

ritmo:
  zona_horaria: "America/Argentina/Buenos_Aires"
  max_por_dia: 7                  # noticias + promos por día (4 noticias + 3 promos). Las enseñanzas y las preguntas de X van aparte
  promos_por_dia: 3               # cuántas de esas 10 son ventas de tus herramientas y campañas
  horarios_promos: ["10:00", "15:00", "20:00"]   # desde esa hora sale la promo que toca
  # Las noticias comunes salen después de cada uno de estos horarios (lo urgente sale siempre).
  # Así queda el día en Telegram: 7:30 agenda · 8:30 enseñanza · 9:30 noticia · 10:30 promo · 11:30 noticia
  # · 12:30 enseñanza · 14:00 noticia · 15:30 promo · 17:00 noticia · 18:30 enseñanza · 20:30 promo
  horarios_noticias: ["09:00", "11:00", "14:00", "17:00"]
  horas_entre_promos: 3           # nunca dos promos pegadas
  max_llamados_por_dia: 2         # tope de noticias con "registrate con mi link" (aparte de las promos)
  minutos_entre_publicaciones: 40 # separación mínima entre una y otra (el bot mira una vez por hora)
  impacto_minimo: 7               # del 1 al 10. Más alto = publica menos, solo lo fuerte
  impacto_de_relleno: 6           # si el día viene flojo (van 2 o más de atraso) también sale lo de este impacto. Con 7 nunca rellena
  silencio_desde: "00:00"         # de madrugada no publica...
  silencio_hasta: "07:00"
  impacto_urgente: 9              # ...salvo que la noticia sea de este impacto o más
  impacto_urgente_ocupado: 10     # si en esa hora ya salió otra cosa, solo sale igual lo de este impacto (si no, espera a la hora siguiente)
  urgentes_de_noche: false        # de madrugada no sale nada, ni lo urgente: queda guardado y sale a la mañana
  antiguedad_maxima_horas: 6      # no publica noticias más viejas que esto

# ------------------------------------------------------------
#  IMAGEN
#    modo: ninguna = el bot publica solo el texto. La imagen la hacés vos a mano (por ejemplo en ChatGPT).

# Si a un socio le falta el link, se usa este.
enlace_general: "https://linktr.ee/comunidadinversores"

# ------------------------------------------------------------
#  PROMOS: las ventas de tus herramientas y las campañas.
#  El bot las va rotando y escribe un texto distinto cada vez, pero SOLO con
#  los datos que figuren acá: no inventa nada, no promete ganancias y no da
#  cifras de resultados (para eso invita a ver el dossier o el video).
#  Una promo sale únicamente si dice "activa: true".
#
#  Campos opcionales:
#    socio           la marca (usa su link, su llamado y su aviso)
#    enlace          un link propio para esta promo (le gana al del socio)
#    aviso           una aclaración propia que va debajo del llamado
#    texto_sin_link  qué decir en X en lugar de "el link está en mi perfil"
#    dato_fijo       algo que no puede faltar nunca en la publicación (un código de descuento)
#    extras          hasta 3 links más, solo en Telegram (un dossier, un tutorial)
#    vence           último día en que sale. Ej: "2026-12-31". Después deja de salir sola y te avisa
#    imagen          una imagen propia, ej. assets/promos/senales.jpg
#                    (en modo "ninguna" se publica tal cual · en modo "placa" va arriba y el bot le suma el texto)
#  Los porcentajes solo se aceptan si son un dato del producto que figure acá
#  (un reintegro, un descuento). Nunca como rendimiento o ganancia.
# ------------------------------------------------------------
promos:
  - id: senales-exness
    activa: true
    socio: exness
    etiqueta: "MIS HERRAMIENTAS"
    nombre: "Señales de trading en Exness"
    llamado: "Registrate en Exness con mi link"
    extras:
      - {texto: "Dossier completo: resultados, metodología y riesgos", enlace: "https://drive.google.com/file/d/1mzqNl57Hj3rjzvWKR_6IoVOQ7xSbbf_C/view"}
      - {texto: "Tutorial paso a paso", enlace: "https://youtu.be/WGP222nUgvA"}
    datos: |
      Sistema de señales de trading para operar en Exness. Analiza dos pares de divisas: AUD/CAD y EUR/AUD.
      Indica cuándo entrar, dónde colocar el Stop Loss y el Take Profit, y cuándo pasar a Break Even.
      El canal de señales es gratuito.
      Cómo acceder: 1) registrarse en Exness con el enlace de Ezequiel, 2) verificar la identidad y depositar al menos US$100, 3) escribirle a Ezequiel para pedir el acceso.
      Además hay un 20% de devolución de comisiones, según las condiciones de la propuesta.
      Hay un dossier con el backtest de 2022 a 2026 (1.485 operaciones analizadas): muestra la curva de capital, la metodología y los riesgos. También hay un tutorial en video, paso a paso.

  - id: video-senales
    activa: true
    etiqueta: "VIDEO"
    nombre: "Video: probé más de 9.300 combinaciones de trading"
    llamado: "Mirá el video completo"
    enlace: "https://youtu.be/WGP222nUgvA"
    datos: |
      Video de Ezequiel. Probó más de 9.300 combinaciones de trading y solo 2 pares pasaron: AUD/CAD y EUR/AUD.
      La pregunta del video: ¿puede una estrategia funcionar durante años y seguir funcionando en el futuro?
      Muestra el backtest de más de 4 años sobre esos dos pares, cómo funciona el sistema y cómo seguir las señales.
      No muestra solo una curva linda: también muestra el drawdown, los períodos negativos y los datos usados para el backtest.

  - id: labitconf-2026
    activa: true
    etiqueta: "BENEFICIO"
    nombre: "40% OFF en LABITCONF 2026"
    llamado: "Sacá tu entrada con 40% OFF"
    enlace: "https://www.hallos.io/event/labitconf/checkout"
    texto_sin_link: "en la web de LABITCONF"
    dato_fijo: "Código: COMUNIDADINVERSORES40"
    vence: "2026-10-31"
    datos: |
      Comunidad Inversores es Media Partner de LABITCONF 2026.
      Beneficio para la comunidad: 40% OFF en la entrada GENERAL con el código COMUNIDADINVERSORES40.
      El código tiene hasta 100 usos, es válido para los dos días y se puede usar hasta el evento.
      LABITCONF 2026 es el 30 y 31 de octubre en Costa Salguero, Buenos Aires.
      Además hay 6 entradas para sortear entre la comunidad.

  - id: binance-tarjeta-octubre
    activa: true                  # datos de la página oficial de la campaña (leída el 9/10/2026)
    socio: binance
    etiqueta: "PROMO"
    nombre: "Cashback de octubre con la Binance Card"
    llamado: "Abrí tu cuenta en Binance con mi link"
    aviso: "Promoción de Binance: tiene cupos limitados y condiciones propias."
    vence: "2026-10-28"           # la campaña termina el 29/10 a las 20:59 de Argentina: el último día entero es el 28
    datos: |
      Campaña de Binance en Argentina para la Binance Card: "Tus compras del día a día ahora con cashback". Va del 29 de septiembre al 29 de octubre de 2026.
      Para quienes piden la tarjeta ahora o todavía no la usaron: 50% de cashback instantáneo en las primeras 2 compras cotidianas, hasta 2,5 USDC en cada compra. Es para los primeros 110.000 usuarios.
      Para quienes ya usaban la tarjeta: 5 USDC al gastar 50 USD en total durante la campaña; hay que confirmar la participación en la página de la campaña. Es para los primeros 20.000 usuarios.
      Según los términos de Binance, participan los usuarios con la identidad verificada que recibieron el aviso de la campaña (en la app o por mail). Los cupos son limitados.

  - id: binance-tarjeta
    activa: true                  # datos de la página oficial del lanzamiento (leída el 9/10/2026)
    socio: binance
    etiqueta: "PROMO"
    nombre: "Tarjeta física de Binance"
    llamado: "Abrí tu cuenta en Binance con mi link"
    aviso: "Promoción de Binance: tiene cupos limitados y condiciones propias."
    vence: "2026-10-30"           # el envío es gratis si se pide antes del 31/10; en noviembre hay que actualizar los datos
    datos: |
      Llegó a la Argentina la Binance Card física.
      Se pide desde el panel de Tarjeta, en la app o en la web de Binance. Llega por correo en hasta 12 días y se activa con el código que viene en el sobre.
      El envío es gratis si se pide antes del 31 de octubre de 2026.
      Tiene 3% de cashback instantáneo en las compras elegibles, con tope de 100 USDC por mes, hasta el 31 de diciembre de 2026. Para tenerlo hay que hacer la primera compra con la tarjeta física antes del 30 de noviembre; el 3% corre desde el mes siguiente.
      Según los términos de Binance, participan los usuarios con la identidad verificada que recibieron el aviso de la promoción (en la app o por mail).

  # --- Pionex: guardadas para cuando se vuelva a promocionar (hoy el socio está con activo: false) ---
  - id: bots-pionex
    activa: false
    socio: pionex
    etiqueta: "MIS HERRAMIENTAS"
    nombre: "Mis bots de Pionex"
    llamado: "Copiá mis bots en Pionex con mi link"
    datos: |
      Ezequiel Bagnato arma sus propios bots de trading en Pionex.
      Se copian con el copy trading del propio exchange (CopyBot): no hay que configurar nada.
      La plata siempre queda en la cuenta de cada usuario; Ezequiel nunca la toca.
      Operan criptomonedas de forma automática, las 24 horas.
      Ezequiel muestra los resultados a la comunidad, tanto los buenos como los malos.

  - id: pionex-bienvenida
    activa: false
    socio: pionex
    etiqueta: "PROMO"
    nombre: "Campaña de bienvenida de Pionex"
    llamado: "Registrate en Pionex con mi link"
    vence: ""
    datos: |
      Pionex tiene una campaña de bienvenida para usuarios nuevos que se registran con el link de Ezequiel.
      El bono se desbloquea en 3 pasos: verificar la cuenta, hacer el primer depósito y abrir un bot propio.

